<div class="w-full mx-auto p-4 bg-white rounded-xl">

    <!-- USER INFO -->
    <div class="flex justify-between">
         <!-- Title -->
    <h2 class="text-5xl font-semibold mb-3 text-[#5A3E2B]">Menu</h2>
        <div class="flex items-center gap-3 mb-4">
        <img src="https://via.placeholder.com/48"
             class="w-12 h-12 rounded-full object-cover"
             alt="User Avatar">
        <div>
            <p class="text-2xl font-semibold text-[#5A3E2B]">Trần Minh Anh</p>
            <p class="text-lg text-gray-500">Thu ngân</p>
        </div>
    </div>
    </div>



    <!-- Search -->
    <div class="relative mb-4 text-3xl">
        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
        </div>

        <input
            type="text"
            placeholder="Tìm kiếm món..."
            id="search-input"
            class="w-full py-3 pl-10 pr-3 bg-[#E9DFD0] text-[#5A3E2B] rounded-xl focus:outline-none"
        />
    </div>

    <!-- Category List -->
    <div id="category-list" class="text-2xl flex gap-2 overflow-x-auto flex-nowrap pb-2">
        <button class=" px-4 py-2 rounded-full bg-[#8A4A2F] text-white whitespace-nowrap">
            Tất Cả
        </button>

        {% for c in category %}
        <button data-id="{{ c.id }}" class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            {{ c.name }}
        </button>
        {% endfor %}
    </div>

    <div id="alert-small-1" class="col-span-3 text-2xl w-auto inline-flex items-center p-2 pe-3 mb-4 mt-4 text-fg-brand-strong rounded-full bg-brand-softer border border-brand-subtle hidden" role="alert">
        <span class="bg-brand-soft text-fg-brand-strong py-0.5 px-2 rounded-full">Thông Báo</span>
        <div class="ms-2">
            Không có món này
        </div>
    </div>

</div>
