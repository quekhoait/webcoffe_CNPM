{% for dish in dishes %}
<div class="data-item w-full bg-white rounded-xl shadow-md p-2" 
ondblclick="addToOrder({{ dish.id }}, '{{ dish.name }}', {{ dish.price }})">
    <div class="flex overflow-hidden rounded-lg">
        <img src="https://picsum.photos/seed/picsum/200/300" class="w-full h-48 object-cover">
    </div>

    <div class="mt-3 px-1">
        <p class="text-lg font-semibold text-gray-800">{{ dish.name }}</p>
        <p class="text-base text-gray-500">{{ dish.price }}</p>
    </div>
</div>
{% endfor %}
