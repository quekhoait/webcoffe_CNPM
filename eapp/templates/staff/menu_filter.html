
<div class="w-full mx-auto p-4 bg-white rounded-xl">
    <!-- Title -->
    <h2 class="text-xl font-semibold mb-3 text-[#5A3E2B]">Menu</h2>

    <!-- Search -->
    <div class="relative mb-4">
        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
        </div>

        <input
                type="text"
                placeholder="Tìm kiếm món..."
                class="w-full py-3 pl-10 pr-3 bg-[#E9DFD0] text-[#5A3E2B] rounded-xl focus:outline-none"
        />
    </div>

    <!-- Category Slider (only scroll when many items) -->
    <div class="flex gap-2 overflow-x-auto flex-nowrap pb-2">
        <button class="px-4 py-2 rounded-full bg-[#8A4A2F] text-white whitespace-nowrap">
            Tất cả
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Cà phê
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Trà sữa
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Nước ép
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Bánh ngọt
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Ăn vặt
        </button>
        <button class="px-4 py-2 rounded-full bg-[#E9DFD0] text-[#5A3E2B] whitespace-nowrap">
            Món nóng
        </button>
    </div>
</div>
