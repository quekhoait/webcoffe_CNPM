{% if dish %}
<div id="dish-{{ dish.id }}" class="text-2xl grid grid-cols-6 mt-3 p-2 items-center border-b border-gray-400">
    <div class="col-span-3">
        <p class="font-semibold text-gray-800">{{ dish.name }}</p>
        <span class="text-xl text-gray-600">{{ dish.price }}đ</span>
    </div>

    <div class="col-span-2 flex items-center justify-center">
        <button class="bg-gray-200 w-10 h-10 rounded-full flex justify-center items-center"
        onclick="addToOrder({{ dish.id }}, '{{ dish.name }}', {{ dish.price }}, -1)"
        ><span
                class="text-xl">-</span>
        </button>
        <input type="text" value="{{ dish.quantity }}"
            class="w-16 h-8 text-center font-semibold border-none focus:ring-0 bg-transparent text-gray-800 "
            onblur="inputQuantity({{ dish.id }}, '{{ dish.name }}', {{ dish.price }}, this)">
        <button class="bg-gray-200 w-10 h-10 rounded-full flex justify-center items-center"
            onclick="addToOrder({{ dish.id }}, '{{ dish.name }}', {{ dish.price }}, 1)"
        ><span>+</span>
        </button>
    </div>

    <div class="col-span-1 text-right">
        <span id="dish-price-{{ dish.id }}">{{ dish.quantity * dish.price }} đ</span>
        <button class="text-red-500 hover:text-red-700">
            <i class="fas fa-trash-alt"></i>
        </button>
    </div>
</div>
{%  endif %}
