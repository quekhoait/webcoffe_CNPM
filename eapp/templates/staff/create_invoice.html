<div class="">
    <div class="bg-amber-50 p-5 h-screen flex flex-col">
        <!-- order header -->
        <div class="flex justify-between text-2xl">
            <h2 class="font-bold text-gray-800">Đơn hàng - #DH123123</h2>
            <div>
                <span class="font-semibold text-gray-600">Số bàn:</span>
                <input type="text" value="12"
                    class="text-2xl w-12 h-8 text-center px-1 py-1 bg-amber-100 text-gray-800 font-semibold rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 border border-transparent">
            </div>
        </div>

        <!-- order item label -->
        <div class="text-blue-700 grid grid-cols-6 text-lg font-semibold p-2 mt-3 bg-white shadow">
            <div class="col-span-3">Sản Phẩm</div>
            <div class="col-span-2 text-center">Số Lượng</div>
            <div class="col-span-1 text-right">Thành Tiền</div>
        </div>

        <!-- order items -->
        <div class="list-order-item overflow-auto flex-1 scrollbar-none">
            {% include 'staff/invoice_item.html' %}
        </div>

        <!-- order bill -->
        <div class="text-lg bg-white p-4 rounded-xl mt-3"
            style="box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;">
            <div class="flex justify-between text-gray-600 text-base">
                <span>Tạm tính</span>
                <span id="total-price-tmp">{{ total_price_tmp }} đ</span>
            </div>

            <!-- Phụ phí -->
            <div class="text-base text-gray-600">
                {% if rules %}
                {% for rule in rules %}
                <div class="flex justify-between">
                    <span>{{ rule.name }}</span>
                    <span>{{ rule.value }} <span>{{ rule.unit }}</span></span>
                </div>
                {% endfor %}
                {% endif %}
            </div>

            <div class="flex justify-between pt-2 font-semibold text-gray-800 text-lg">
                <span>Tổng cộng</span>
                <span id="total-price" class="text-red-700">{{ total_price }} đ</span>
            </div>
        </div>

        <!-- order button -->
        <!-- order buttons -->
        <div class="mt-6 w-full flex justify-between gap-4">
            <!-- Tạo Đơn Hàng -->
            <button onclick="submitInvoice()"
                class="flex-1 text-xl py-2 bg-amber-800 text-white font-bold rounded-xl shadow-lg hover:bg-amber-900 transition duration-200 flex justify-center items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" />
                    <path fill-rule="evenodd"
                        d="M4 5a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4v-4H6a2 2 0 01-2-2V5zm3 1h6v6H7V6z"
                        clip-rule="evenodd" />
                </svg>
                <span class="text-lg">Tạo Đơn Hàng</span>
            </button>

            <!-- Hủy -->
            <button onclick="clearInvoice()"
                class="flex-1 text-xl py-2 bg-red-500 text-white font-bold rounded-xl shadow-lg hover:bg-red-600 transition duration-200 flex justify-center items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                <span class="text-lg">Hủy</span>
            </button>
        </div>

    </div>
</div>
