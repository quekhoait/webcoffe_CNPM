<aside class="w-[16%] bg-white p-8 shadow-md border-r border-gray-200 hidden md:block">
    <div class="flex flex-col h-screen  bg-white ">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-[30px]">
                <img src="https://res.cloudinary.com/ds11ggie4/image/upload/v1764250180/user_liifdm.png"
                    class="rounded-full">
            </div>
            <div>
                <h4 class="font-bold text-3xl text-gray-800">Nhân viên kho</h4>
                <p class="text-2xl text-gray-500">Nhân viên </p>
            </div>
        </div>
        <nav class="space-y-2 ">
            <a href="{{url_for('warehouse')}}"
                class="block {% if request.endpoint == 'warehouse' %}
           bg-yellow-400 text-yellow-900 p-6 rounded-lg
       {% else %}
             bg-white text-black  p-6 rounded-lg
       {% endif %}"><i
                    class="fa-solid fa-warehouse mr-3 text-2xl"></i>Quản lý Kho</a>
            <a href="{{url_for('warehouse_slip')}}"
                class="block {% if request.endpoint == 'warehouse_slip' %}
           bg-yellow-400 text-yellow-900 p-6 rounded-lg
       {% else %}
           bg-white text-black  p-6 rounded-lg
       {% endif %}"><i
                    class="fa-solid fa-warehouse mr-3 text-2xl"></i>Phiếu kho</a>
        </nav>

        <!-- Logout -->
        <div class="p-8 border-t border-gray-100 mt-auto">
            <a href="/logout" class="flex items-center gap-3 px-6 py-4 text-red-500
                  hover:bg-red-50 rounded-2xl bg-red-100 transition text-lg font-semibold">
