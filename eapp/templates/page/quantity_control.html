<div class="flex items-center border border-gray-300 rounded-full overflow-hidden text-2xl">
    <button id="minus-btn"
            class="w-10 h-10 text-4xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition duration-150"
            aria-label="Giảm số lượng">
        &minus;
    </button>
    <span id="qty-display" class="w-10 text-center font-medium text-gray-900">
        2
    </span>
    <button id="plus-btn"
            class="w-10 h-10 text-4xl flex items-center justify-center text-gray-600 hover:bg-gray-100 transition duration-150"
            aria-label="Tăng số lượng">
        +
    </button>
</div>
<script>
    // Thiết lập component QuantityControl
function setupQuantityControl(initialQuantity = 1) {
    const qtyDisplay = document.getElementById('qty-display');
    const minusBtn = document.getElementById('minus-btn');
    const plusBtn = document.getElementById('plus-btn');

    let currentQuantity = initialQuantity;
    qtyDisplay.textContent = currentQuantity;

    // Cập nhật giao diện khi số lượng thay đổi
    const updateDisplay = () => {
        qtyDisplay.textContent = currentQuantity;
        // Có thể thêm logic vô hiệu hóa nút trừ nếu số lượng = 1
        minusBtn.disabled = currentQuantity <= 1;
        minusBtn.style.opacity = currentQuantity <= 1 ? 0.5 : 1;
    };

    // Xử lý nút tăng
    plusBtn.addEventListener('click', () => {
        currentQuantity++;
        updateDisplay();
        // Thông báo cho component cha (nếu cần)
        console.log('New Quantity:', currentQuantity);
    });

    // Xử lý nút giảm
    minusBtn.addEventListener('click', () => {
        if (currentQuantity > 1) {
            currentQuantity--;
            updateDisplay();
            // Thông báo cho component cha (nếu cần)
            console.log('New Quantity:', currentQuantity);
        }
    });
    updateDisplay(); // Khởi tạo lần đầu
}

document.addEventListener('DOMContentLoaded', () => {
    setupQuantityControl(1);
});
</script>
