<div class="flex items-center border border-gray-300 rounded-full overflow-hidden text-2xl quantity-control-wrapper">

    <!-- Nút giảm -->
    <button
        class="minus-btn w-10 h-10 text-4xl flex items-center justify-center
               text-gray-600 hover:bg-gray-100 transition duration-150"
        aria-label="Giảm số lượng"
    >
        -
    </button>

    <!-- Số lượng -->
    <span
        class="w-10 text-center font-medium text-gray-900 qty-display"
        data-initial-qty="{{ quantity }}"
    >
        {{ quantity }}
    </span>

    <!-- Nút tăng -->
    <button
        class="plus-btn w-10 h-10 text-4xl flex items-center justify-center transition duration-150
               {% if not in_stock %}
                   text-gray-400 cursor-not-allowed
               {% else %}
                   text-gray-600 hover:bg-gray-100
               {% endif %}"
        aria-label="Tăng số lượng"
        {% if not in_stock %} disabled {% endif %}
    >
        +
    </button>

</div>
