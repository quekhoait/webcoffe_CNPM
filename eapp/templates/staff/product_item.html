{% if products %}
{% for product in products %}
<div class="data-item w-full bg-white rounded-xl shadow-md p-1 relative
            hover:shadow-xl hover:bg-yellow-50 hover:cursor-pointer transition duration-200"
     ondblclick="addToOrder({{ product.id }}, '{{ product.name }}', {{ product.price }})">
    
    <div class="flex overflow-hidden rounded-lg">
        <img src="{{ product.image }}" class="w-full h-48 object-cover">
    </div>

    <div class="mt-2 px-1">
        <p class="text-sm font-semibold text-gray-800">{{ product.name }}</p>
        <p class="text-sm text-gray-500">{{ product.price }}đ</p>
    </div>

    <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200 pointer-events-none">
        <span class="bg-amber-200 text-amber-800 font-bold text-xs px-2 py-1 rounded-lg select-none">
            + Thêm vào đơn
        </span>
    </div>
</div>
{% endfor %}
{% else %}
<div id="alert-small-1" class="col-span-3 text-sm w-auto inline-flex items-center p-2 pe-3 mb-4 mt-4 text-fg-brand-strong rounded-full bg-brand-softer border border-brand-subtle" role="alert">
    <span class="bg-brand-soft text-fg-brand-strong py-0.5 px-2 rounded-full">Thông Báo</span>
    <div class="ms-2">
        Không có món này 
    </div>
</div>
{% endif %}
